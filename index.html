    --blush:#D98B97; --blush-lt:#F8E7E8; --blush-bd:#EBC6CA;
    --jade:#57755F; --jade-lt:#EDF3EE;
    --serif:"NotoSerifKR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
    --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;padding:0;min-height:100vh;position:relative;overflow-x:hidden;
    background:
      radial-gradient(ellipse at 50% -8%, rgba(222,143,154,.20), transparent 52%),
      radial-gradient(circle at 12% 22%, rgba(255,255,255,.65), transparent 40%),
      radial-gradient(circle at 88% 88%, rgba(206,183,146,.30), transparent 46%),
      var(--paper);
    color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  }

  /* 흩날리는 배꽃잎 */
  .fall{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .pt{position:absolute;top:-8%;width:13px;height:13px;background:var(--blush);
      border-radius:50% 8% 50% 8%;opacity:.34;animation:drift linear infinite;}
  @keyframes drift{
    0%{transform:translate3d(0,-30px,0) rotate(0deg);opacity:0;}
    12%{opacity:.36;}
    88%{opacity:.28;}
    100%{transform:translate3d(34px,102vh,0) rotate(420deg);opacity:0;}
  }
  .pt:nth-child(1){left:6%;animation-duration:17s;animation-delay:0s;}
  .pt:nth-child(2){left:19%;animation-duration:23s;animation-delay:3s;width:9px;height:9px;opacity:.24;}
  .pt:nth-child(3){left:33%;animation-duration:20s;animation-delay:7s;}
  .pt:nth-child(4){left:47%;animation-duration:26s;animation-delay:1.5s;width:10px;height:10px;}
  .pt:nth-child(5){left:59%;animation-duration:19s;animation-delay:9s;}
  .pt:nth-child(6){left:71%;animation-duration:24s;animation-delay:5s;width:8px;height:8px;opacity:.22;}
  .pt:nth-child(7){left:84%;animation-duration:21s;animation-delay:12s;}
  .pt:nth-child(8){left:93%;animation-duration:28s;animation-delay:2s;width:11px;height:11px;}
  @media (prefers-reduced-motion: reduce){ .fall{display:none;} *{animation:none!important;} }

  .app{width:100%;max-width:460px;padding:0 20px calc(30px + env(safe-area-inset-bottom));
       position:relative;z-index:1;}
  .screen{display:none;}
  .screen.on{display:block;animation:rise .32s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* ── 표지 ── */
  .cover{text-align:center;padding:46px 0 0;}
  .bloom{width:52px;height:52px;margin:0 auto;display:block;}
  .kicker{font-size:11.5px;letter-spacing:.26em;color:var(--ink2);margin:18px 0 12px;}
  .cover h1{font-family:var(--serif);font-size:34px;margin:0;font-weight:700;
            letter-spacing:.02em;line-height:1.3;color:var(--ink);}
  .hanja{display:block;font-family:var(--serif);font-size:14px;font-weight:400;
         color:var(--blush);letter-spacing:.42em;margin-top:9px;text-indent:.42em;}
  .lead{font-family:var(--serif);font-size:18px;color:var(--seal);margin:20px 0 0;
        font-weight:600;letter-spacing:.01em;}
  .whisper{font-size:13.5px;color:var(--ink2);margin:9px 0 0;letter-spacing:.01em;}

  /* 붉은 실 구분선 */
  .thread{display:flex;align-items:center;gap:11px;margin:28px 0;}
  .thread::before,.thread::after{content:"";flex:1;height:1px;
    background:repeating-linear-gradient(90deg,var(--blush-bd) 0 5px,transparent 5px 10px);}
  .thread i{width:6px;height:6px;background:var(--seal);border-radius:50%;
            transform:rotate(45deg);border-radius:50% 8% 50% 8%;}

  .howto{background:var(--paper2);border:1px solid var(--line);border-radius:5px;
         padding:19px 21px;text-align:left;list-style:none;margin:0;
         box-shadow:0 1px 0 rgba(255,255,255,.7) inset;}
  .howto li{font-size:14.5px;color:var(--ink2);margin:0 0 8px;line-height:1.68;
            padding-left:15px;position:relative;word-break:keep-all;}
  .howto li:last-child{margin:0;}
  .howto li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;
    background:var(--blush);border-radius:50% 8% 50% 8%;}
  .howto b{color:var(--ink);font-weight:700;}

  /* ── 버튼 ── */
  .btn{display:block;width:100%;border:none;border-radius:5px;cursor:pointer;
       font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.06em;
       padding:18px 16px;color:#fff;margin-top:24px;
       background:linear-gradient(180deg,var(--seal) 0%,var(--seal-d) 100%);
       box-shadow:0 2px 10px rgba(140,42,47,.22);transition:transform .12s,box-shadow .12s;}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 5px rgba(140,42,47,.2);}

  /* ── 문항 ── */
  .bar{display:flex;align-items:center;justify-content:center;gap:11px;padding:28px 0 18px;}
  .pflower{width:38px;height:38px;flex:0 0 auto;}
  .pflower .pl{fill:#EFE4D2;transition:fill .4s cubic-bezier(.2,.7,.3,1);}
  .pflower .pl.fill{fill:var(--blush);}
  .step{font-family:var(--serif);font-size:14px;color:var(--ink2);letter-spacing:.09em;}

  .card{position:relative;background:var(--paper2);border:1px solid var(--line);
        border-radius:5px;padding:34px 24px 30px;min-height:180px;
        display:flex;align-items:center;
        box-shadow:0 2px 14px rgba(120,95,60,.07);}
  .card::before{content:"問";position:absolute;top:11px;right:12px;
    font-family:var(--serif);font-size:11px;color:#fff;background:var(--seal);
    width:21px;height:21px;line-height:21px;text-align:center;border-radius:3px;
    opacity:.9;letter-spacing:0;}
  .qtext{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.66;
         letter-spacing:-.005em;margin:0;word-break:keep-all;}

  .picks{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px;}
  .pick{border:1.5px solid var(--line);background:var(--paper2);border-radius:5px;
        padding:19px 8px;font-family:var(--serif);cursor:pointer;
        transition:transform .12s,border-color .18s,background .18s;}
  .pick .mk{display:block;font-size:26px;font-weight:600;line-height:1;margin-bottom:8px;}
  .pick .lb{display:block;font-size:17px;font-weight:700;letter-spacing:.06em;}
  .pick.o{color:var(--seal);border-color:var(--blush-bd);}
  .pick.x{color:var(--ink2);}
  .pick:active{transform:scale(.975);}
  .pick[disabled]{cursor:default;opacity:.3;}
  .pick.sel-right{opacity:1;border-color:var(--jade);background:var(--jade-lt);color:var(--jade);}
  .pick.sel-wrong{opacity:1;border-color:var(--seal);background:var(--blush-lt);color:var(--seal);}
  .pick.reveal{opacity:1;border-color:var(--jade);border-style:dashed;color:var(--jade);}

  .fb{margin-top:15px;padding:18px 20px;border-radius:5px;border:1px solid var(--line);
      background:var(--paper2);animation:rise .3s cubic-bezier(.2,.7,.3,1);}
  .fb.ok{border-color:#CBDDD0;background:var(--jade-lt);}
  .fb.no{border-color:var(--blush-bd);background:var(--blush-lt);}
  .fb .vd{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 0 8px;letter-spacing:.02em;}
  .fb.ok .vd{color:var(--jade);} .fb.no .vd{color:var(--seal);}
  .fb p.ex{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.7;word-break:keep-all;}

  /* ── 결과 ── */
  .res{text-align:center;padding:36px 0 0;}
  .crest{position:relative;width:164px;height:164px;margin:0 auto 20px;}
  .bigbloom{width:164px;height:164px;display:block;}
  .stamp{position:absolute;left:50%;top:50%;width:82px;height:82px;border-radius:50%;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         border:2.5px solid var(--seal);color:var(--seal);
         background:var(--paper2);box-shadow:0 2px 12px rgba(120,95,60,.13);
         animation:press .55s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes press{
    0%{transform:translate(-50%,-50%) scale(2.2) rotate(15deg);opacity:0;}
    55%{opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1) rotate(-7deg);opacity:1;}}
  .stamp.fail{border-color:var(--ink2);color:var(--ink2);}
  .stamp .n{font-family:var(--serif);font-size:31px;font-weight:700;line-height:1;}
  .stamp .of{font-family:var(--serif);font-size:11px;letter-spacing:.06em;margin-top:2px;opacity:.7;}
  .res h2{font-family:var(--serif);font-size:27px;margin:0 0 11px;font-weight:700;letter-spacing:.01em;}
  .res .msg{font-size:15px;color:var(--ink2);margin:0;line-height:1.75;word-break:keep-all;}

  .callout{margin-top:24px;padding:20px;border-radius:5px;color:#fff;
           background:linear-gradient(180deg,var(--seal) 0%,var(--seal-d) 100%);
           box-shadow:0 3px 14px rgba(140,42,47,.2);}
  .callout b{display:block;font-family:var(--serif);font-size:18px;
             margin-bottom:5px;letter-spacing:.04em;}
  .callout span{font-size:13.5px;opacity:.93;}
  .callout.dim{background:var(--paper2);color:var(--ink2);border:1px solid var(--line);box-shadow:none;}
  .callout.dim b{color:var(--ink);}

  .closing{margin-top:22px;padding:18px 20px;border-radius:5px;
           border:1px dashed var(--blush-bd);background:rgba(248,231,232,.42);}
  .closing p{margin:0;font-family:var(--serif);font-size:14.5px;line-height:1.8;
             color:var(--ink2);word-break:keep-all;}

  .review{margin-top:26px;text-align:left;}
  .review h3{font-size:11px;letter-spacing:.2em;color:var(--ink2);font-weight:600;
             margin:0 0 13px;padding-bottom:9px;border-bottom:1px solid var(--line);}
  .rv{display:flex;gap:10px;padding:11px 0;border-bottom:1px dotted var(--line);}
  .rv:last-child{border:none;}
  .rv .ic{flex:0 0 auto;width:19px;height:19px;border-radius:50%;color:#fff;font-size:11px;
          font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px;}
  .rv.ok .ic{background:var(--jade);} .rv.no .ic{background:var(--blush);}
  .rv .tx{font-size:13.5px;color:var(--ink2);line-height:1.6;word-break:keep-all;}
  .rv .tx b{color:var(--ink);font-weight:600;}

  .foot{margin-top:32px;padding-top:17px;border-top:1px solid var(--line);
        text-align:center;font-size:11px;color:var(--ink2);letter-spacing:.14em;opacity:.7;}
</style>
</head>
<body>

          <ellipse class="pl" id="pl0" cx="50" cy="26" rx="13.5" ry="20"/>

    <div class="picks">
      <button class="pick o" id="p-o" type="button"><span class="mk">○</span><span class="lb">옳소</span></button>
      <button class="pick x" id="p-x" type="button"><span class="mk">✕</span><span class="lb">그르오</span></button>
    </div>
    <div id="fbwrap"></div>

  <!-- 결과 -->

<script>
(function () {
  "use strict";

  var Q = [
    {t:"ETF 한 주만 사도 여러 종목에 나누어 투자하는 효과를 낼 수 있다.",a:true,

    {t:"ETF에 투자하면 원금 손실이 절대 발생하지 않는다.",a:false,
     e:"ETF도 시장 상황에 따라 값이 떨어질 수 있습니다. 예금이 아니라 투자상품이에요."},
    {t:"ETF는 주식처럼 거래소에서 실시간으로 사고팔 수 있다.",a:true,

    {t:"주가가 오를 종목을 정확한 타이밍에 사고파는 일은 전문가에게는 쉬운 일이다.",a:false,
     e:"단기 타이밍은 전문가도 꾸준히 맞히기 어렵습니다. 그래서 방향에 올라타 오래 머무르는 편이 유효해요."},
    {t:"ETF는 반드시 하나의 종목에만 투자하는 상품이다.",a:false,

    {t:"ETF는 '상장지수펀드'로, 법적으로는 펀드의 한 종류다.",a:true,

    {t:"ETF는 최소 100주 단위로만 살 수 있다.",a:false,

    {t:"국내 주식으로 구성된 ETF는 매매차익에 세금을 내지 않는다.",a:true,

    {t:"ETF에서 나오는 '분배금'은 주식의 배당금과 비슷한 개념이다.",a:true,

    {t:"레버리지 ETF는 안전한 편이라 투자 초보자에게 가장 먼저 권한다.",a:false,

    {t:"인버스 ETF는 지수가 떨어질 때 오히려 수익이 나도록 설계된 상품이다.",a:true,
     e:"지수와 반대로 움직이도록 만들어졌습니다. 다만 방향을 맞혀야 해서 난이도가 높아요."},
    {t:"ETF가 상장폐지되면 투자한 돈이 전부 사라진다.",a:false,
     e:"상장폐지일 기준 순자산가치에서 보수를 뺀 금액을 돌려받습니다. 담고 있던 종목의 가치는 그대로예요."},
    {t:"국내 거래소에도 미국 S&P500 같은 해외 지수를 따라가는 ETF가 상장되어 있다.",a:true,
     e:"원화로, 국내 증권 계좌에서 해외 지수를 따라가는 ETF를 살 수 있습니다."},
    {t:"ETF는 증권 계좌 없이도 살 수 있다.",a:false,
     e:"거래소에 상장된 상품이라 증권 계좌가 있어야 매매할 수 있어요."},
    {t:"반도체, 2차전지처럼 특정 산업에 집중 투자하는 ETF도 있다.",a:true,
     e:"지수형 외에 산업·테마 ETF도 많습니다. 다만 한 산업에 몰릴수록 분산 효과는 줄어요."},
    {t:"ETF가 어떤 종목을 담고 있는지는 투자자가 알 수 없다.",a:false,
     e:"ETF는 담고 있는 종목 구성을 매일 공개합니다. 투명성이 ETF의 큰 장점이에요."},
    {t:"같은 지수를 따라가는 ETF는 운용사가 달라도 보수가 모두 똑같다.",a:false,
     e:"운용사마다 보수가 다릅니다. 오래 들고 갈수록 이 차이가 쌓이니 비교해볼 만해요."},
    {t:"분산투자란 한 곳에 몰아넣지 않고 여러 자산에 나누어 담는 것을 말한다.",a:true,
     e:"하나가 부진해도 다른 것이 버텨주도록 위험을 나누는 방법입니다."},
    {t:"주가는 오직 그 기업의 실적에 의해서만 움직인다.",a:false,
     e:"산업의 변화, 금리, 환율, 경제 상황까지 수많은 인연이 얽혀 움직입니다. 그래서 한 종목을 맞히기가 어려워요."},
    {t:"ACE는 한국투자신탁운용의 ETF 브랜드다.",a:true,
     e:"2022년 10월, 기존 KINDEX에서 ACE로 브랜드를 바꾸었습니다."},
    {t:"ETF는 거래소가 열리지 않는 새벽에도 자유롭게 사고팔 수 있다.",a:false,
     e:"거래소가 열려 있는 시간에만 매매할 수 있습니다. 국내 정규장은 오전 9시부터 오후 3시 30분까지예요."},
    {t:"적립식 투자란 목돈을 한 번에 넣는 대신 일정 금액을 나누어 꾸준히 투자하는 방식이다.",a:true,
     e:"사는 시점을 여러 번으로 나눠 '언제 살까'의 부담을 줄이는 방법입니다."},
    {t:"ETF의 시장 가격은 실제 순자산가치와 조금씩 차이가 날 수 있다.",a:true,
     e:"이 차이를 괴리율이라고 합니다. 유동성공급자(LP)가 그 차이를 줄이는 역할을 해요."},
    {t:"기대수익이 높은 상품은 대체로 위험도 함께 크다.",a:true,
     e:"수익과 위험은 대체로 같이 움직입니다. '위험 없이 높은 수익'을 말하는 상품은 의심해봐야 해요."},
    {t:"ETF는 예금자보호 대상이어서 원금이 보장된다.",a:false,
     e:"ETF는 예금이 아니라 투자상품이라 예금자보호 대상이 아니고, 원금도 보장되지 않습니다."}
  ];

  var TOTAL = 5, PASS = 3;
  var ORD = ["첫 번째","두 번째","세 번째","네 번째","다섯 번째"];

  function $(id){ return document.getElementById(id); }

  function shuffle(src){
    var a = src.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 옳소/그르오가 각각 최소 2문항씩 나오도록 뽑는다 (찍기 방지 + 체감 난이도 안정)
  function draw(){
    var yes = [], no = [], i;
    for (i = 0; i < Q.length; i++) { (Q[i].a ? yes : no).push(Q[i]); }
    if (yes.length < 2 || no.length < 2 || Q.length < TOTAL) {
      return shuffle(Q).slice(0, Math.min(TOTAL, Q.length));
    }
    yes = shuffle(yes); no = shuffle(no);
    var picked = [yes[0], yes[1], no[0], no[1]];
    var rest = shuffle(yes.slice(2).concat(no.slice(2)));
    for (i = 0; picked.length < TOTAL && i < rest.length; i++) { picked.push(rest[i]); }
    return shuffle(picked);
  }

  var set = [], idx = 0, score = 0, log = [], locked = false;

  function show(id){
    var all = document.querySelectorAll('.screen'), i;
    for (i = 0; i < all.length; i++) { all[i].className = 'screen'; }
    $(id).className = 'screen on';
    if (window.scrollTo) { window.scrollTo(0, 0); }
  }

  function paintPetals(){
    var i, el;
    for (i = 0; i < TOTAL; i++) {
      el = $('pl' + i);
      if (el) { el.setAttribute('class', 'pl' + (i < idx ? ' fill' : '')); }
    }
  }

  function start(){
    set = draw(); idx = 0; score = 0; log = []; locked = false;
    render(); show('s-quiz');
  }

  function render(){
    locked = false;
    var q = set[idx];
    $('qtext').textContent = q.t;
    $('step').textContent = ORD[idx] + ' 물음';
    paintPetals();
    $('fbwrap').innerHTML = '';
    $('nextwrap').innerHTML = '';
    var o = $('p-o'), x = $('p-x');
    o.className = 'pick o'; x.className = 'pick x';
    o.disabled = false; x.disabled = false;
  }

  function answer(choice){
    if (locked) { return; }          // 연타 방지
    locked = true;
    var q = set[idx], right = (choice === q.a);
    if (right) { score++; }
    log.push({ t: q.t, e: q.e, a: q.a, ok: right });

    var o = $('p-o'), x = $('p-x');
    o.disabled = true; x.disabled = true;
    var chosen = choice ? o : x, other = choice ? x : o;
    chosen.className = 'pick ' + (choice ? 'o' : 'x') + (right ? ' sel-right' : ' sel-wrong');
    if (!right) { other.className = 'pick ' + (choice ? 'x' : 'o') + ' reveal'; }

    var fb = document.createElement('div');
    fb.className = 'fb ' + (right ? 'ok' : 'no');
    var vd = document.createElement('p');
    vd.className = 'vd';
    vd.textContent = right ? '그대의 눈이 밝소' : ('빗나갔소 — 답은 ' + (q.a ? '옳소' : '그르오') + '요');
    var ex = document.createElement('p');
    ex.className = 'ex';
    ex.textContent = q.e;
    fb.appendChild(vd); fb.appendChild(ex);
    $('fbwrap').appendChild(fb);

    idx++;                            // 답한 만큼 꽃잎이 물든다
    paintPetals();

    var last = (idx === TOTAL);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = last ? '연서를 맺으오' : '다음 물음';
    btn.onclick = function () {
      if (last) { finish(); } else { render(); }
    };
    $('nextwrap').appendChild(btn);
  }

  function finish(){
    var pass = (score >= PASS), i, r, h = '';
    $('score').textContent = String(score);
    $('stamp').className = 'stamp' + (pass ? '' : ' fail');

    var pet = $('resbloom').getElementsByTagName('ellipse');
    for (i = 0; i < pet.length; i++) {
      pet[i].setAttribute('fill', i < score ? '#D98B97' : '#F2D9DC');
    }

    $('rtitle').textContent = pass ? '그대, 진위를 가리셨소' : '아쉽구려';
    $('rmsg').textContent = '다섯 물음 가운데 ' + score + '문항을 맞히셨습니다.'
      + (pass ? ' ETF, 생각보다 어렵지 않지요?' : '');

    $('callout').className = 'callout' + (pass ? '' : ' dim');
    $('callout').innerHTML = pass
      ? '<b>이 화면을 스텝에게 보여주시오</b><span>간식을 받아갈 수 있습니다</span>'
      : '<b>스텝에게 이 화면을 보여주시오</b><span>아래 풀이를 함께 보아주십니다</span>';

    $('closing').textContent = pass
      ? '허나 투자는 정답을 맞히는 시험이 아니라, 미래의 방향에 함께 올라타는 여정이오. 오늘 이 자리에 선 그대는 이미 투자자요.'
      : '괜찮소. 투자는 정답을 맞히는 시험이 아니라, 미래의 방향에 함께 올라타는 여정이니. 오늘 이 자리에 선 그대는 이미 투자자요.';

    for (i = 0; i < log.length; i++) {
      r = log[i];
      h += '<div class="rv ' + (r.ok ? 'ok' : 'no') + '">'
         + '<span class="ic">' + (r.ok ? '○' : '✕') + '</span>'
         + '<span class="tx"><b>' + esc(r.t) + '</b><br>'
         + '답 ' + (r.a ? '옳소' : '그르오') + ' — ' + esc(r.e) + '</span></div>';
    }
    $('rlist').innerHTML = h;
    show('s-res');
  }

  function esc(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  $('go').onclick = start;
  $('p-o').onclick = function () { answer(true); };
  $('p-x').onclick = function () { answer(false); };
})();
</script>
</body>
</html>
